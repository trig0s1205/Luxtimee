services:
  postgres:
    image: postgres:16-alpine
    container_name: luxtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxtime
      POSTGRES_PASSWORD: luxtime_dev
      POSTGRES_DB: luxtime
    ports:
      - "5432:5432"
    volumes:
      - luxtime_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxtime -d luxtime"]
      interval: 5s
      timeout: 5s
      retries: 10

  image-service:
    build:
      context: ./apps/image-service
      dockerfile: Dockerfile
    container_name: luxtime-image-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  luxtime_pg_data:
