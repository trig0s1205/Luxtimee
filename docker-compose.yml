services:
  postgres:
    image: postgres:16-alpine
    container_name: luxtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxtime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxtime_dev}
      POSTGRES_DB: luxtime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - luxtime_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxtime -d luxtime"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  luxtime_pg_data:
