# Producción VPS: API (GHCR) + Caddy (HTTPS).
# Requiere .env con API_IMAGE, API_DOMAIN, ACME_EMAIL y secretos de la API.
# No incluye postgres ni image-service.

services:
  api:
    image: ${API_IMAGE:?Defina API_IMAGE en .env (tag sha-…, no latest)}
    restart: always
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1024}
    expose:
      - "3000"
    mem_limit: 1400m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - api_uploads:/app/apps/api/uploads
    networks:
      - luxtimee
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - luxtimee
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  luxtimee:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  api_uploads:
