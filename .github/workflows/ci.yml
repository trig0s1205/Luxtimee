name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @luxtime/api exec prisma generate
      - name: Migrate database
        run: pnpm --filter @luxtime/api exec prisma migrate deploy
      - run: pnpm --filter @luxtime/shared build
      - run: pnpm typecheck
      - run: pnpm --filter @luxtime/api test
      - name: Inventario pagination
        run: pnpm --filter @luxtime/web exec node --import ./scripts/register-jiti.mjs --test utils/inventory-pagination.test.ts
      - name: Build (skip web SSR in CI)
        run: pnpm --filter @luxtime/shared build && pnpm --filter @luxtime/api build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

  vps-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/vps/*.sh deploy/vps/tests/*.sh
      - name: set-env con TTY simulado
        run: bash deploy/vps/tests/set-env-tty.sh
