name: Deploy image-service to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/image-service/**'
      - '.github/workflows/deploy-image-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  REPOSITORY: luxtime
  IMAGE: image-service
  SERVICE: luxtime-image-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GCP config
        shell: bash
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          echo "PROJECT_ID=$(trim "$GCP_PROJECT_ID")" >> "$GITHUB_ENV"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          docker build -f apps/image-service/Dockerfile -t "$IMAGE_TAG" -t "$IMAGE_LATEST" apps/image-service
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8001 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "REMBG_MODEL=u2netp" \
            --update-secrets "IMAGE_SERVICE_API_KEY=IMAGE_SERVICE_API_KEY:latest" \
            --project "$PROJECT_ID"
      - name: Verify health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --project "$PROJECT_ID" --format 'value(status.url)')
          curl --fail "$URL/health"

  deploy-disabled:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED != 'true' }}
    steps:
      - run: echo "::notice::Deploy omitido. Configura secrets/variables GCP y GCP_DEPLOY_ENABLED=true"
