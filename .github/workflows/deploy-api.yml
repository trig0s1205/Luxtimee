name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  REPOSITORY: luxtime
  IMAGE: api
  SERVICE: luxtime-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GCP config
        shell: bash
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          echo "PROJECT_ID=$(trim "$GCP_PROJECT_ID")" >> "$GITHUB_ENV"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          gcloud builds submit . \
            --config apps/api/cloudbuild.yaml \
            --substitutions=_IMAGE="$IMAGE_LATEST" \
            --project "$PROJECT_ID"
          echo "IMAGE_TAG=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production,USE_MOCKS=false,JWT_ACCESS_EXPIRES=15m,JWT_REFRESH_EXPIRES=7d,CLOUDINARY_FOLDER=luxtime/watches" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest,IMAGE_SERVICE_URL=IMAGE_SERVICE_URL:latest" \
            --project "$PROJECT_ID"

      - name: Verify health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --project "$PROJECT_ID" --format 'value(status.url)')
          curl --fail "$URL/api/v1/health"

  deploy-disabled:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED != 'true' }}
    steps:
      - run: echo "::notice::Deploy omitido. Configura secrets/variables GCP y GCP_DEPLOY_ENABLED=true"
