name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f apps/api/Dockerfile -t luxtime-api .
      - name: Deploy placeholder
        run: echo "Configurar gcloud auth y deploy a Cloud Run con credenciales GCP"
