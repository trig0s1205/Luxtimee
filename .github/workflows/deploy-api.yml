name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: southamerica-east1
  REPOSITORY: luxtime
  IMAGE: api
  SERVICE: luxtime-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GCP config
        shell: bash
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          echo "PROJECT_ID=$(trim "$GCP_PROJECT_ID")" >> "$GITHUB_ENV"
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"
          docker build -f apps/api/Dockerfile -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "IMAGE_TAG=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Apply Prisma migrations
        run: |
          umask 077
          trap 'rm -f /tmp/luxtime-dburl /tmp/luxtime-directurl /tmp/luxtime-prisma.env' EXIT
          gcloud secrets versions access latest --secret=DATABASE_URL --project "$PROJECT_ID" | tr -d '\r\n' > /tmp/luxtime-dburl
          gcloud secrets versions access latest --secret=DIRECT_URL --project "$PROJECT_ID" | tr -d '\r\n' > /tmp/luxtime-directurl
          test -s /tmp/luxtime-dburl
          test -s /tmp/luxtime-directurl
          {
            printf 'DATABASE_URL='
            cat /tmp/luxtime-dburl
            printf '\nDIRECT_URL='
            cat /tmp/luxtime-directurl
            printf '\n'
          } > /tmp/luxtime-prisma.env
          docker run --rm \
            --env-file /tmp/luxtime-prisma.env \
            -w /app/apps/api \
            --entrypoint sh \
            "$IMAGE_TAG" \
            -c 'if [ -f ./node_modules/prisma/build/index.js ]; then PRISMA=./node_modules/prisma/build/index.js; else PRISMA=$(find /app/node_modules/.pnpm -path "*/prisma/build/index.js" | head -n 1); fi; test -n "$PRISMA"; node "$PRISMA" migrate deploy --schema prisma/schema.prisma'

      - name: Deploy to Cloud Run
        # min-instances queda en 0. En producción conviene 1: README, Rendimiento del storefront.
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3001 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production,USE_MOCKS=false,JWT_ACCESS_EXPIRES=15m,JWT_REFRESH_EXPIRES=90d,COOKIE_SAME_SITE=lax,CLOUDINARY_FOLDER=luxtime/watches,STAFF_LOGIN_SLUG=${{ vars.STAFF_LOGIN_SLUG || 'dev-portal-lx9k2' }}" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,JWT_SECRET=JWT_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest,IMAGE_SERVICE_URL=IMAGE_SERVICE_URL:latest,IMAGE_SERVICE_API_KEY=IMAGE_SERVICE_API_KEY:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,GA4_PROPERTY_ID=GA4_PROPERTY_ID:latest,GA4_CLIENT_EMAIL=GA4_CLIENT_EMAIL:latest,GA4_PRIVATE_KEY=GA4_PRIVATE_KEY:latest" \
            --project "$PROJECT_ID"

      - name: Verify health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --project "$PROJECT_ID" --format 'value(status.url)')
          curl --fail "$URL/api/v1/health"

  deploy-disabled:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_DEPLOY_ENABLED != 'true' }}
    steps:
      - run: echo "::notice::Deploy omitido. Configura secrets/variables GCP y GCP_DEPLOY_ENABLED=true"
